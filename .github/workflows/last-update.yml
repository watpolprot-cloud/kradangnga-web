# บันทึกวันเวลาที่กด Push ขึ้นเว็บครั้งล่าสุด (data/last-update.json) ให้ข้อความ "ปรับปรุงล่าสุด" ท้ายเว็บทุกหน้า
# รันเฉพาะตอนคนกด Push ไม่นับการบันทึกของบอท (TikTok / Instagram / แชตบอต)
name: บันทึกเวลาปรับปรุงเว็บ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: last-update
  cancel-in-progress: false

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: เขียนเวลา Push ล่าสุด (เวลาไทย)
        run: |
          echo "{ \"updated\": \"$(TZ=Asia/Bangkok date +%Y-%m-%dT%H:%M:%S+07:00)\" }" > data/last-update.json
          cat data/last-update.json

      - name: บันทึกขึ้นเว็บ
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-update.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "บันทึกเวลาปรับปรุงเว็บอัตโนมัติ"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: สั่งสร้างหน้าเว็บใหม่
        if: steps.save.outputs.pushed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
