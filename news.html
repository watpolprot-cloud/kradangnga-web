<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ข่าวสารและความเคลื่อนไหว · คณะสีกระดังงา (สีเขียว)</title>
<meta name="description" content="ประกาศ กิจกรรม และผลการแข่งขันของคณะสีกระดังงา เรียงจากล่าสุด">
<link rel="icon" href="assets/img/favicon.png">
<link rel="stylesheet" href="css/style.css?v=20261030t">
</head>
<body>
<section class="page-head"><div class="wrap"><div class="eyebrow">คณะสีกระดังงา · สีเขียว</div><h1>ข่าวสารและความเคลื่อนไหว</h1><p>ประกาศ กิจกรรม และผลการแข่งขันของคณะสีกระดังงา เรียงจากล่าสุด</p></div></section>
<section class="block">
  <div class="wrap">
    <div class="ig-news-strip" id="ig-news" hidden>
      <div class="sec-title">
        <div><h2>ล่าสุดจาก Instagram</h2><p>ประกาศและรับสมัครจาก @green.prot ขึ้นที่นี่ให้เอง</p></div>
        <a class="btn btn-green" href="instagram.html">ดูโพสต์ทั้งหมด</a>
      </div>
      <div class="ig-home-row" id="ig-news-row"></div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="timeline" id="news-list"></div>
  </div>
</section>
<script src="data/site.js"></script>
<script src="data/news.js"></script>
<script src="data/instagram.js"></script>
<script src="data/instagram-feed.js"></script>
<script src="js/common.js?v=20261030t"></script>
<script src="js/instagram.js"></script>
<script>
const types = ["ทั้งหมด", ...new Set(KD.news.map(n => n.type))];
const F = document.getElementById("filters"), L = document.getElementById("news-list");
// ป้ายหัวคอลัมน์ที่แสดงเฉพาะบนมือถือ (ตารางเรียงเป็นบรรทัด)
function tableLabel(head, i, c) {
  if (i === 0) return /^\d+$/.test(c) ? `<span class="m-lab">${esc(head[0])} </span>` : "";
  return `<span class="m-lab">${esc(head[i])}: </span>`;
}
function render(t) {
  F.innerHTML = types.map(x => `<button class="chip${x === t ? " active" : ""}" data-t="${esc(x)}">${esc(x)}</button>`).join("");
  F.querySelectorAll(".chip").forEach(b => b.onclick = () => render(b.dataset.t));
  L.innerHTML = KD.news.filter(n => t === "ทั้งหมด" || n.type === t).map(n => `
    <div class="tl-item reveal">
      <article class="tl-card${n.image ? " has-img" : ""}">
        ${n.image ? `<img src="assets/img/thumbs/${esc(n.image)}" alt="" loading="lazy">` : ""}
        <div class="card-body">
          <div class="meta"><span class="tag t-${esc(n.type)}">${esc(n.type)}</span><span>${thDate(n.date)}</span></div>
          <h3>${esc(n.title)}</h3>
          <p>${esc(n.body)}</p>
          ${n.table ? `<details class="news-table"><summary>${esc(n.table.summary || "ดูรายละเอียด")}</summary>
            <div class="tbl-wrap"><table class="tbl"><thead><tr>${n.table.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
            <tbody>${n.table.rows.map(r => `<tr>${r.map((c, i) => `<td>${tableLabel(n.table.head, i, c)}${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>` : ""}
          ${n.link ? `<a class="more-link" href="${esc(n.link)}">${esc(n.linkText || "อ่านต่อ")}</a>` : ""}
          ${n.link2 ? `<a class="more-link" href="${esc(n.link2)}"${/^https?:/.test(n.link2) ? ' target="_blank" rel="noopener"' : ""}>${esc(n.linkText2 || "อ่านต่อ")}</a>` : ""}
          ${n.album ? `<a class="more-link" href="gallery.html#${esc(n.album)}">ดูอัลบั้มภาพ</a>` : ""}
        </div>
      </article>
    </div>`).join("");
  revealAll();
}
render("ทั้งหมด");

// โพสต์ Instagram ล่าสุด: ประกาศด่วนก่อน ตามด้วยหมวดประกาศ แล้วจึงโพสต์อื่น
(function () {
  const I = KDI;
  if (!I.posts.length) return;
  const rank = p => p.urgent ? 0 : p.cat === "news" ? 1 : 2;
  const list = I.posts.slice().sort((a, b) => rank(a) - rank(b) || (b.ts || 0) - (a.ts || 0)).slice(0, 4);
  document.getElementById("ig-news").hidden = false;
  const row = document.getElementById("ig-news-row");
  row.innerHTML = list.map(I.cardHtml).join("");
  I.bindCards(row);
  revealAll();
})();
</script>
</body>
</html>
